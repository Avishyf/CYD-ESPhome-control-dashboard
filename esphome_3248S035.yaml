                  text: "BACK"
                  align: CENTER
                  styles:
                    - style_small_text

        # Instructions Label
        - label:
            id: hotspot_instructions_label
            text: "1. Connect your phone/PC to WiFi:\n   SSID: CYD-3.5-Remote-AP\n   Password: password123\n\n2. Open your web browser to:\n   http://192.168.4.1\n\n3. Select your network & connect!"
            x: 30
            y: 80
            styles:
              - style_normal_text

# Dynamically update clock and settings labels
interval:
  # Fast clock update (every 1 second)
  - interval: 1s
    then:
      - lvgl.label.update:
          id: settings_time_label
          text: !lambda |-
            char time_str[20];
            id(sntp_time).now().strftime(time_str, sizeof(time_str), "%H:%M");
            return std::string(time_str);
      - if:
          condition:
            lambda: |-
              return id(cyd_backlight)->remote_values.is_on() && 
                     (lv_disp_get_inactive_time(NULL) >= (id(screen_timeout_s) * 1000));
          then:
            - lambda: |-
                auto call = id(cyd_backlight).make_call();
                call.set_state(false);
                call.set_transition_length(500); // 0.5s fade
                call.perform();
            - lvgl.pause:

  # Medium network and sensor refresh (every 2 seconds)
  - interval: 2s
    then:
      - lvgl.label.update:
          id: settings_ip_label
          text: !lambda 'return "IP: " + id(cyd_ip_address).state;'
      - lvgl.label.update:
          id: settings_ssid_label
          text: !lambda 'return "SSID: " + id(cyd_ssid).state;'
      - lambda: |-
          float rssi = id(cyd_wifi_signal).state;
          uint32_t active_color = id(dark_mode) ? 0x4A6984 : 0x22C55E;    // Slate Blue vs Bright Green
          uint32_t inactive_color = id(dark_mode) ? 0x2E3238 : 0xE2E8F0;  // Dark grey vs Bright grey
          int bars = 0;
          if (!std::isnan(rssi) && rssi != 0.0f && rssi > -100.0f) {
            if (rssi >= -55.0f) bars = 4;
            else if (rssi >= -70.0f) bars = 3;
            else if (rssi >= -80.0f) bars = 2;
            else bars = 1;
          }
          lv_obj_set_style_bg_color(id(wifi_bar_1), lv_color_hex(bars >= 1 ? active_color : inactive_color), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(wifi_bar_2), lv_color_hex(bars >= 2 ? active_color : inactive_color), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(wifi_bar_3), lv_color_hex(bars >= 3 ? active_color : inactive_color), LV_PART_MAIN);
          lv_obj_set_style_bg_color(id(wifi_bar_4), lv_color_hex(bars >= 4 ? active_color : inactive_color), LV_PART_MAIN);
          
          bool is_connected = wifi::global_wifi_component->is_connected();
          uint32_t btn_color = is_connected ? (id(dark_mode) ? 0x4A6984 : 0xE2E8F0) : 0xFF0000;
          lv_obj_set_style_bg_color(id(btn_settings), lv_color_hex(btn_color), LV_PART_MAIN);

# Expose 4 Template Switch Entities for Seamless Switch Syncing in HA
switch:
  - platform: template
    name: "CYD S1"
    id: cyd_s1
    lambda: 'return id(cyd_l1)->remote_values.is_on();'
    turn_on_action:
      - light.turn_on: cyd_l1
    turn_off_action:
      - light.turn_off: cyd_l1
  - platform: template
    name: "CYD S2"
    id: cyd_s2
    lambda: 'return id(cyd_l2)->remote_values.is_on();'
    turn_on_action:
      - light.turn_on: cyd_l2
    turn_off_action:
      - light.turn_off: cyd_l2
  - platform: template
    name: "CYD S3"
    id: cyd_s3
    lambda: 'return id(cyd_l3)->remote_values.is_on();'
    turn_on_action:
      - light.turn_on: cyd_l3
    turn_off_action:
      - light.turn_off: cyd_l3
  - platform: template
    name: "CYD S4"
    id: cyd_s4
    lambda: 'return id(cyd_l4)->remote_values.is_on();'
    turn_on_action:
      - light.turn_on: cyd_l4
    turn_off_action:
      - light.turn_off: cyd_l4

# Top-level Restart Button to allow programmatic reboots
button:
  - platform: restart
    id: esp_restart_button
    name: "CYD Restart"
