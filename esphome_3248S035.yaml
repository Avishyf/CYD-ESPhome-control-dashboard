# Core LVGL touchscreen UI Configuration
lvgl:
  displays:
    - cyd_display
  touchscreens:
    - touchscreen_id: cyd_touchscreen
      long_press_time: 750ms
  style_definitions:
    # Font and color styles
    - id: style_title_text
      text_font: font_title
      text_color: 0xFFFFFF
    - id: style_normal_text
      text_font: font_normal
      text_color: 0xCBD5E1
    - id: style_small_text
      text_font: font_small
      text_color: 0x94A3B8
      
    # Custom dashboard card buttons
    - id: style_card_btn
      bg_color: 0x2E3238
      radius: 12
      border_width: 1
      border_color: 0x3E444D
      pad_all: 10
    - id: style_card_btn_pressed
      bg_color: 0x4A6984
      border_color: 0x6080A0
    - id: style_icon
      text_font: font_icon
      text_color: 0x64748B
    - id: style_icon_large
      text_font: font_icon_large
      text_color: 0x64748B
    - id: style_icon_toggle
      text_font: font_icon_toggle
      text_color: 0xFFEB3B

  pages:
    # ------------------- 1. Main Page Dashboard (Symmetrically scaled for 480x320) -------------------
    - id: main_page
      bg_color: 0x1A1D20
      widgets:
        # Channel 1 Card
        - button:
            id: btn_l1
            x: 10
            y: 10
            width: 220
            height: 140
            styles:
              - style_card_btn
            on_press:
              - lambda: 'id(l1_long_pressed) = false;'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(l1_long_pressed);'
                  then:
                    - light.toggle: cyd_l1
            on_long_press:
              - lambda: |-
                  id(l1_long_pressed) = true;
                  id(active_channel) = 1;
                  float ct = id(cyd_l1)->remote_values.get_color_temperature();
                  lv_obj_set_style_bg_grad_color(id(brightness_slider), lv_color_hex(id(get_temp_color)(ct)), LV_PART_MAIN);
              - lvgl.label.update:
                  id: channel_title
                  text: !lambda |-
                    return std::string(lv_label_get_text(id(l1_name_label)));
              - lvgl.slider.update:
                  id: brightness_slider
                  value: !lambda |-
                    auto light = id(cyd_l1);
                    return (light->remote_values.is_on() ? light->remote_values.get_brightness() : 0.0f) * 100.0f;
              - lvgl.slider.update:
                  id: tone_slider
                  value: !lambda |-
                    return id(cyd_l1)->remote_values.get_color_temperature();
              - if:
                  condition:
                    lambda: 'return id(l1_type) == 1;'
                  then:
                    - lvgl.page.show: channel_page
                  else:
                    - lvgl.label.update:
                        id: switch_title
                        text: !lambda |-
                          return std::string(lv_label_get_text(id(l1_name_label)));
                    - lambda: |-
                        auto light = id(cyd_l1);
                        int logo = id(l1_logo);
                        const char* glyph = "\U000F0769";
                        if (logo == 2) glyph = "\U000F179B";
                        else if (logo == 3) glyph = "\U000F1798";
                        else if (logo == 4) glyph = "\U000F1054";
                        else if (logo == 5) glyph = "\U000F0425";
                        else if (logo == 6) glyph = "\U000F0210";
                        else if (logo == 7) glyph = "\U000F001B";
                        else if (logo == 8) glyph = "\U000F02E3";
                        lv_label_set_text(id(switch_page_logo_label), glyph);

                        if (light->remote_values.is_on()) {
                          lv_obj_set_style_bg_color(id(btn_switch_toggle), lv_color_hex(0x2C4022), LV_PART_MAIN);
                          lv_label_set_text(id(switch_toggle_label), "ACTIVE");
                          if (logo >= 1 && logo <= 4) {
                            float ct = light->remote_values.get_color_temperature();
                            lv_obj_set_style_text_color(id(switch_page_logo_label), lv_color_hex(id(get_temp_color)(ct)), LV_PART_MAIN);
                          } else {
                            lv_obj_set_style_text_color(id(switch_page_logo_label), lv_color_hex(0x22C55E), LV_PART_MAIN);
                          }
                        } else {
                          lv_obj_set_style_bg_color(id(btn_switch_toggle), lv_color_hex((id(dark_mode) ? 0x2E3238 : 0xE2E8F0)), LV_PART_MAIN);
                          lv_label_set_text(id(switch_toggle_label), "INACTIVE");
                          lv_obj_set_style_text_color(id(switch_page_logo_label), lv_color_hex(0x64748B), LV_PART_MAIN);
                        }
                    - lvgl.page.show: switch_page
            widgets:
              - label:
                  id: l1_name_label
                  text: "L1"
                  align: TOP_LEFT
                  styles:
                    - style_title_text
              - label:
                  id: l1_status_label
                  text: "OFF"
                  align: BOTTOM_LEFT
                  styles:
                    - style_normal_text
              - label:
                  id: l1_logo_label
                  text: "\U000F0769"
                  align: CENTER
                  x: 45
                  y: 5
                  styles:
                    - style_icon_large

        # Channel 2 Card
        - button:
            id: btn_l2
            x: 250
            y: 10
            width: 220
            height: 140
            styles:
              - style_card_btn
            on_press:
              - lambda: 'id(l2_long_pressed) = false;'
            on_click:
              - if:
                  condition:
                    lambda: 'return !id(l2_long_pressed);'
                  then:
                    - light.toggle: cyd_l2
            on_long_press:
              - lambda: |-
                  id(l2_long_pressed) = true;
                  id(active_channel) = 2;
                  float ct = id(cyd_l2)->remote_values.get_color_temperature();
                  lv_obj_set_style_bg_grad_color(id(brightness_slider), lv_color_hex(id(get_temp_color)(ct)), LV_PART_MAIN);
              - lvgl.label.update:
                  id: channel_title
                  text: !lambda |-
                    return std::string(lv_label_get_text(id(l2_name_label)));
              - lvgl.slider.update:
                  id: brightness_slider
                  value: !lambda |-
                    auto light = id(cyd_l2);
                    return (light->remote_values.is_on() ? light->remote_values.get_brightness() : 0.0f) * 100.0f;
              - lvgl.slider.update:
                  id: tone_slider
                  value: !lambda |-
                    return id(cyd_l2)->remote_values.get_color_temperature();
              - if:
                  condition:
                    lambda: 'return id(l2_type) == 1;'
                  then:
                    - lvgl.page.show: channel_page
                  else:
                    - lvgl.label.update:
                        id: switch_title
                        text: !lambda |-
                          return std::string(lv_label_get_text(id(l2_name_label)));
                    - lambda: |-
                        auto light = id(cyd_l2);
                        int logo = id(l2_logo);
                        const char* glyph = "\U000F0769";
                        if (logo == 2) glyph = "\U000F179B";
                        else if (logo == 3) glyph = "\U000F1798";
