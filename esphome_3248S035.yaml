            border_color: 0x1A1D20
            on_click:
              - lambda: |-
                  // Update screen timeout slider and label using step index mapping
                  int to_val = id(screen_timeout_s);
                  int idx = 1; // default 15s
                  if (to_val == 5) idx = 0;
                  else if (to_val == 15) idx = 1;
                  else if (to_val == 30) idx = 2;
                  else if (to_val == 60) idx = 3;
                  else if (to_val == 180) idx = 4;
                  else if (to_val == 300) idx = 5;
                  else if (to_val == 600) idx = 6;
                  else {
                    // Fallback to closest step
                    const int timeouts[] = {5, 15, 30, 60, 180, 300, 600};
                    int min_diff = 9999;
                    for (int i = 0; i < 7; i++) {
                      int diff = abs(to_val - timeouts[i]);
                      if (diff < min_diff) {
                        min_diff = diff;
                        idx = i;
                      }
                    }
                  }
                  lv_slider_set_value(id(timeout_slider), idx, LV_ANIM_OFF);
                  
                  const char* labels[] = {
                    "Screen Timeout: 5s", "Screen Timeout: 15s", "Screen Timeout: 30s", 
                    "Screen Timeout: 1m", "Screen Timeout: 3m", "Screen Timeout: 5m", "Screen Timeout: 10m"
                  };
                  lv_label_set_text(id(timeout_label), labels[idx]);

                  // Update backlight slider
                  float bl = id(cyd_backlight)->remote_values.get_brightness();
