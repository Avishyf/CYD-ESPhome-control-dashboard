    # ------------------- 3. Settings Menu page (Symmetrically scaled for 480x320) -------------------
    - id: settings_page
      bg_color: 0x1A1D20
      widgets:
        # Title
        - label:
            id: settings_title
            text: "Settings"
            x: 110
            y: 20
            styles:
              - style_title_text

        # Back Button
        - button:
            id: btn_settings_back
            x: 15
            y: 15
            width: 80
            height: 40
            bg_color: 0x2E3238
            radius: 8
            on_click:
              - lvgl.page.show: main_page
            widgets:
              - label:
                  text: "BACK"
                  align: CENTER
                  styles:
                    - style_small_text

        # WiFi Setup Button
        - button:
            id: btn_wifi_setup
            x: 315
            y: 15
            width: 150
            height: 40
            bg_color: 0x2E3238
            radius: 8
            on_click:
              - lambda: |-
                  esp_wifi_set_mode(WIFI_MODE_APSTA);
                  wifi_config_t ap_config = {};
                  strcpy((char*)ap_config.ap.ssid, "CYD-3.5-Remote-AP");
                  strcpy((char*)ap_config.ap.password, "password123");
                  ap_config.ap.ssid_len = strlen("CYD-3.5-Remote-AP");
                  ap_config.ap.channel = 1;
                  ap_config.ap.authmode = WIFI_AUTH_WPA2_PSK;
                  ap_config.ap.max_connection = 4;
                  esp_wifi_set_config(WIFI_IF_AP, &ap_config);
                  id(cyd_captive_portal)->start();
              - lvgl.page.show: wifi_hotspot_page
            widgets:
              - label:
                  text: "WIFI SETUP"
                  align: CENTER
                  styles:
                    - style_small_text

        # Theme Label
        - label:
            id: settings_theme_label
            text: "Theme:"
            x: 250
            y: 108
            styles:
              - style_normal_text

        # Theme Toggle - pill track (plain obj to avoid button padding/press-state)
        - obj:
            id: btn_theme_toggle_vertical
            x: 320
            y: 99
            width: 76
            height: 36
            radius: 18
            border_width: 1
            border_color: 0x1565C0
            bg_color: 0x1E88E5
            pad_all: 0
            on_click:
              - lambda: |-
                  id(dark_mode) = !id(dark_mode);
                  global_preferences->sync();
              - script.execute: apply_theme_script
            widgets:
              # Thumb circle - positioned at left initially (bright mode)
              - obj:
                  id: theme_toggle_thumb
                  x: 2
                  y: 2
                  width: 30
                  height: 30
                  radius: 15
                  bg_color: 0xFFFFFF
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  widgets:
                    - label:
                        id: theme_toggle_icon
                        text: "\U000F05A8"
                        align: CENTER
                        styles:
                          - style_icon_toggle

        # SSID Info
        - label:
            id: settings_ssid_label
            text: "SSID: Searching..."
            x: 30
            y: 70
            styles:
              - style_normal_text

        # IP Info
        - label:
            id: settings_ip_label
            text: "IP: Connecting..."
            x: 30
            y: 105
            styles:
              - style_normal_text

        # WiFi Signal Strength Label
        - label:
            id: settings_wifi_signal_label
            text: "Signal:"
            x: 250
            y: 70
            styles:
              - style_normal_text


        # WiFi Signal Multi-Height Solid Bars (Bottom-aligned with "Signal:" text)
        - obj:
            id: wifi_bar_1
            x: 325
            y: 79
            width: 4
            height: 6
            bg_color: 0x2E3238
            bg_opa: 100%
            border_width: 0
            radius: 1
        - obj:
            id: wifi_bar_2
            x: 331
            y: 74
            width: 4
            height: 11
            bg_color: 0x2E3238
            bg_opa: 100%
            border_width: 0
            radius: 1
        - obj:
            id: wifi_bar_3
            x: 337
            y: 69
            width: 4
            height: 16
            bg_color: 0x2E3238
            bg_opa: 100%
            border_width: 0
            radius: 1
        - obj:
            id: wifi_bar_4
            x: 343
            y: 64
            width: 4
            height: 21
            bg_color: 0x2E3238
            bg_opa: 100%
            border_width: 0
            radius: 1

        # Screen Timeout Section
        - label:
            id: timeout_label
            text: "Screen Timeout: 15s"
            x: 75
            y: 150
            styles:
              - style_normal_text

        - slider:
            id: timeout_slider
            x: 75
            y: 175
            width: 330
            height: 30
            min_value: 0
            max_value: 6
            value: 1
            bg_color: 0x141619
            radius: 8
            indicator:
              bg_color: 0x6080A0
            on_value:
              - lambda: |-
                  int idx = x;
                  if (idx >= 0 && idx <= 6) {
                    const char* labels[] = {
                      "Screen Timeout: 5s", "Screen Timeout: 15s", "Screen Timeout: 30s", 
                      "Screen Timeout: 1m", "Screen Timeout: 3m", "Screen Timeout: 5m", "Screen Timeout: 10m"
                    };
                    lv_label_set_text(id(timeout_label), labels[idx]);
                  }
            on_release:
              - lambda: |-
                  int idx = x;
                  if (idx >= 0 && idx <= 6) {
                    const int timeouts[] = {5, 15, 30, 60, 180, 300, 600};
                    id(screen_timeout_s) = timeouts[idx];
                  }

        # Manual Backlight Override
        - label:
            id: backlight_label
            text: "Display Backlight"
            x: 75
            y: 220
            styles:
              - style_normal_text

        - slider:
            id: backlight_override_slider
            x: 75
            y: 245
            width: 330
            height: 30
            min_value: 10
            max_value: 100
            value: 80
            bg_color: 0x141619
            radius: 8
            indicator:
              bg_color: 0x6080A0
            on_release:
              - lambda: |-
                  float val = x / 100.0f;
                  auto call = id(cyd_backlight).make_call();
                  call.set_brightness(val);
                  call.set_state(val > 0.0f);
                  call.perform();

        # Color Swap Button (BGR vs RGB)
        - button:
            id: btn_color_swap
            x: 75
            y: 282
            width: 140
            height: 32
            bg_color: 0x2E3238
            radius: 8
            border_width: 1
            border_color: 0x3E444D
            on_click:
              - lambda: |-
                  id(color_order_rgb) = !id(color_order_rgb);
                  global_preferences->sync();

                  // Apply color order preference matching the current display rotation
                  uint8_t madctl = 0x00;
                  switch (id(cyd_display).get_rotation()) {
                    case DISPLAY_ROTATION_0_DEGREES:   madctl = 0x40; break;
                    case DISPLAY_ROTATION_90_DEGREES:  madctl = 0x20; break;
                    case DISPLAY_ROTATION_180_DEGREES: madctl = 0x80; break;
                    case DISPLAY_ROTATION_270_DEGREES: madctl = 0xE0; break;
                  }
                  if (!id(color_order_rgb)) {
                    madctl |= 0x08; // Set BGR bit
                  }
                  id(cyd_display).send_command(0x36, &madctl, 1);

                  // Invalidate current active screen to redraw colors
                  lv_obj_invalidate(lv_scr_act());

                  // Update button color
                  lv_obj_set_style_bg_color(id(btn_color_swap), lv_color_hex(id(color_order_rgb) ? 0x4A6984 : (id(dark_mode) ? 0x2E3238 : 0xE2E8F0)), LV_PART_MAIN);
            widgets:
              - label:
                  text: "SWAP RED/BLUE"
                  align: CENTER
                  styles:
                    - style_small_text

