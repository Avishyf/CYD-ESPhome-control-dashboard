esphome:
  name: cyd-3-5-lights-controller
  friendly_name: CYD 3.5 Lights Controller
  includes:
    - <esp_wifi.h>
  on_boot:
    priority: -100.0
    then:
      - lambda: |-
          // Apply color order preference (RGB vs BGR) matching the current display rotation
          uint8_t madctl = 0x00;
          switch (id(cyd_display).get_rotation()) {
            case DISPLAY_ROTATION_0_DEGREES:   madctl = 0x40; break;
            case DISPLAY_ROTATION_90_DEGREES:  madctl = 0x20; break;
            case DISPLAY_ROTATION_180_DEGREES: madctl = 0x80; break;
            case DISPLAY_ROTATION_270_DEGREES: madctl = 0xE0; break;
          }
          if (!id(color_order_rgb)) {
            madctl |= 0x08; // Set BGR bit
          }
          id(cyd_display).send_command(0x36, &madctl, 1);
      - script.execute: apply_theme_script
      - light.turn_on:
          id: cyd_backlight
          brightness: 0.8
      - lvgl.label.update:
          id: l1_name_label
          text: !lambda 'return id(cyd_l1)->get_name();'
      - lvgl.label.update:
          id: l2_name_label
          text: !lambda 'return id(cyd_l2)->get_name();'
      - lvgl.label.update:
          id: l3_name_label
          text: !lambda 'return id(cyd_l3)->get_name();'
      - lvgl.label.update:
          id: l4_name_label
          text: !lambda 'return id(cyd_l4)->get_name();'
      - lambda: |-
          // Initialize default light values on very first boot (no prior info)
          if (!id(defaults_warm_initialized)) {
            id(defaults_warm_initialized) = true;
            id(l1_saved_brightness) = 1.0f; id(l1_saved_color_temp) = 500.0f;
            id(l2_saved_brightness) = 1.0f; id(l2_saved_color_temp) = 500.0f;
            id(l3_saved_brightness) = 1.0f; id(l3_saved_color_temp) = 500.0f;
            id(l4_saved_brightness) = 1.0f; id(l4_saved_color_temp) = 500.0f;
          }

          // Restore saved brightness and color temperature for each channel on boot
          float saved_b[] = { id(l1_saved_brightness), id(l2_saved_brightness), id(l3_saved_brightness), id(l4_saved_brightness) };
          float saved_ct[] = { id(l1_saved_color_temp), id(l2_saved_color_temp), id(l3_saved_color_temp), id(l4_saved_color_temp) };
          light::LightState* lights[] = { id(cyd_l1), id(cyd_l2), id(cyd_l3), id(cyd_l4) };
          for (int i = 0; i < 4; i++) {
            auto call = lights[i]->make_call();
            call.set_brightness(saved_b[i]);
            call.set_color_temperature(saved_ct[i]);
            call.set_state(lights[i]->remote_values.is_on()); // Keep its current power state
            call.perform();
          }

          // Force initial rendering of all channel logos based on saved globals
          const char* glyphs[] = {
            "\U000F0769", "\U000F179B", "\U000F1798", "\U000F1054",
            "\U000F0425", "\U000F0210", "\U000F001B", "\U000F02E3"
          };
          auto set_logo = [&](int logo_idx, lv_obj_t* label) {
            if (logo_idx >= 1 && logo_idx <= 8) {
              lv_label_set_text(label, glyphs[logo_idx - 1]);
              lv_obj_set_style_text_color(label, lv_color_hex(0x64748B), LV_PART_MAIN);
            }
          };
          set_logo(id(l1_logo), id(l1_logo_label));
          set_logo(id(l2_logo), id(l2_logo_label));
          set_logo(id(l3_logo), id(l3_logo_label));
          set_logo(id(l4_logo), id(l4_logo_label));

script:
  - id: apply_theme_script
    then:
      - lambda: |-
          bool dark = id(dark_mode);
          uint32_t bg_color = dark ? 0x1A1D20 : 0xF1F5F9;      // Dark bg vs Slate 100
          uint32_t card_color = dark ? 0x2E3238 : 0xE2E8F0;    // Slate 800 vs Slate 200 (Bright Grey)
          uint32_t border_color = dark ? 0x3E444D : 0xCBD5E1;  // Slate 700 vs Slate 300
          
          uint32_t text_white = dark ? 0xFFFFFF : 0x000000;    // White vs Black
          uint32_t text_grey = dark ? 0xCBD5E1 : 0x334155;     // Slate 300 vs Slate 700
          uint32_t text_small = dark ? 0x94A3B8 : 0x475569;    // Slate 400 vs Slate 600

          // Apply to pages
          if (id(main_page) != nullptr) lv_obj_set_style_bg_color(id(main_page)->obj, lv_color_hex(bg_color), LV_PART_MAIN);
          if (id(channel_page) != nullptr) lv_obj_set_style_bg_color(id(channel_page)->obj, lv_color_hex(bg_color), LV_PART_MAIN);
          if (id(switch_page) != nullptr) lv_obj_set_style_bg_color(id(switch_page)->obj, lv_color_hex(bg_color), LV_PART_MAIN);
          if (id(settings_page) != nullptr) lv_obj_set_style_bg_color(id(settings_page)->obj, lv_color_hex(bg_color), LV_PART_MAIN);
          if (id(config_page) != nullptr) lv_obj_set_style_bg_color(id(config_page)->obj, lv_color_hex(bg_color), LV_PART_MAIN);
          if (id(wifi_hotspot_page) != nullptr) lv_obj_set_style_bg_color(id(wifi_hotspot_page)->obj, lv_color_hex(bg_color), LV_PART_MAIN);

          // Apply to static buttons
          lv_obj_t* btns[] = {
            id(btn_settings_back), id(btn_wifi_setup),
            id(btn_back), id(btn_config_dimmer), id(btn_switch_back), id(btn_config_switch),
            id(btn_config_back), id(btn_hotspot_back),
            id(btn_settings),
            id(btn_mode_dimmer), id(btn_mode_switch),
            id(btn_logo_1), id(btn_logo_2), id(btn_logo_3), id(btn_logo_4),
            id(btn_logo_5), id(btn_logo_6), id(btn_logo_7), id(btn_logo_8)
          };
          for (auto* btn : btns) {
            if (btn != nullptr) {
              lv_obj_set_style_bg_color(btn, lv_color_hex(card_color), LV_PART_MAIN);
              lv_obj_set_style_border_color(btn, lv_color_hex(border_color), LV_PART_MAIN);
              lv_obj_set_style_border_width(btn, 1, LV_PART_MAIN);
            }
          }

          // Apply to card buttons (default states)
          lv_obj_t* cards[] = { id(btn_l1), id(btn_l2), id(btn_l3), id(btn_l4) };
          for (auto* card : cards) {
            if (card != nullptr) {
              lv_obj_set_style_bg_color(card, lv_color_hex(card_color), LV_PART_MAIN);
              lv_obj_set_style_border_color(card, lv_color_hex(border_color), LV_PART_MAIN);
              lv_obj_set_style_border_width(card, 1, LV_PART_MAIN);
            }
          }

          // Helper to style child labels of buttons
          auto set_button_label_colors = [](lv_obj_t* parent, uint32_t color) {
            if (parent == nullptr) return;
            uint32_t child_cnt = lv_obj_get_child_cnt(parent);
            for (uint32_t i = 0; i < child_cnt; i++) {
              lv_obj_t* child = lv_obj_get_child(parent, i);
              if (child != nullptr && lv_obj_check_type(child, &lv_label_class)) {
                lv_obj_set_style_text_color(child, lv_color_hex(color), LV_PART_MAIN);
              }
            }
          };

          // Apply button text colors
          lv_obj_t* text_btns[] = {
            id(btn_settings_back), id(btn_wifi_setup),
            id(btn_back), id(btn_config_dimmer), id(btn_switch_back), id(btn_config_switch),
            id(btn_config_back), id(btn_hotspot_back),
            id(btn_mode_dimmer), id(btn_mode_switch)
          };
          for (auto* btn : text_btns) {
            set_button_label_colors(btn, text_small);
          }

          // Apply to white text labels
          lv_obj_t* white_labels[] = {
            id(l1_name_label), id(l2_name_label), id(l3_name_label), id(l4_name_label),
            id(channel_title), id(switch_title), id(config_title), id(settings_title), id(wifi_hotspot_title),
            id(settings_time_label)
          };
          for (auto* lbl : white_labels) {
            if (lbl != nullptr) {
              lv_obj_set_style_text_color(lbl, lv_color_hex(text_white), LV_PART_MAIN);
            }
          }

          // Apply to grey text labels
          lv_obj_t* grey_labels[] = {
            id(settings_ssid_label), id(settings_ip_label), id(settings_wifi_signal_label), id(settings_theme_label),
            id(brightness_label), id(tone_label), id(backlight_label), id(timeout_label),
            id(config_mode_label), id(config_logo_label), id(switch_toggle_label), id(hotspot_instructions_label)
          };
          for (auto* lbl : grey_labels) {
            if (lbl != nullptr) {
              lv_obj_set_style_text_color(lbl, lv_color_hex(text_grey), LV_PART_MAIN);
            }
          }

          // Apply to small / card status labels
          lv_obj_t* small_labels[] = {
            id(l1_status_label), id(l2_status_label), id(l3_status_label), id(l4_status_label)
          };
          for (auto* lbl : small_labels) {
            if (lbl != nullptr) {
              lv_obj_set_style_text_color(lbl, lv_color_hex(text_small), LV_PART_MAIN);
            }
          }

          // Theme Toggle - animate thumb slide
          if (id(btn_theme_toggle_vertical) != nullptr) {
            uint32_t track_bg     = dark ? 0x2A2D32 : 0x1E88E5;
            uint32_t track_border = dark ? 0x3E444D : 0x1565C0;
            lv_obj_set_style_bg_color(id(btn_theme_toggle_vertical), lv_color_hex(track_bg), LV_PART_MAIN);
            lv_obj_set_style_border_color(id(btn_theme_toggle_vertical), lv_color_hex(track_border), LV_PART_MAIN);
          }

          if (id(theme_toggle_thumb) != nullptr) {
            uint32_t thumb_bg = dark ? 0x4A5060 : 0xFFFFFF;
            lv_obj_set_style_bg_color(id(theme_toggle_thumb), lv_color_hex(thumb_bg), LV_PART_MAIN);

            // Smooth slide animation
            lv_anim_t a;
            lv_anim_init(&a);
            lv_anim_set_var(&a, id(theme_toggle_thumb));
            lv_anim_set_exec_cb(&a, (lv_anim_exec_xcb_t) lv_obj_set_x);
            lv_anim_set_values(&a, lv_obj_get_x(id(theme_toggle_thumb)), dark ? 42 : 2);
            lv_anim_set_time(&a, 250);
            lv_anim_set_path_cb(&a, lv_anim_path_ease_in_out);
            lv_anim_start(&a);
          }

          if (id(theme_toggle_icon) != nullptr) {
            lv_label_set_text(id(theme_toggle_icon), dark ? "\U000F0594" : "\U000F05A8");
            lv_obj_set_style_text_color(id(theme_toggle_icon), lv_color_hex(dark ? 0xB0BAC6 : 0xFFEB3B), LV_PART_MAIN);
          }

          if (id(btn_color_swap) != nullptr) {
            lv_obj_set_style_bg_color(id(btn_color_swap), lv_color_hex(id(color_order_rgb) ? 0x4A6984 : (dark ? 0x2E3238 : 0xE2E8F0)), LV_PART_MAIN);
            lv_obj_set_style_border_color(id(btn_color_swap), lv_color_hex(dark ? 0x3E444D : 0xCBD5E1), LV_PART_MAIN);
          }

# Configure robust preference saving to flash within 10s of any changes
preferences:
  flash_write_interval: 10s

esp32:
  board: esp32dev
  framework:
    type: arduino

# WiFi Configuration
wifi:
  power_save_mode: LIGHT
  
  # Enable captive portal for offline configuration
  ap:
    ssid: "CYD-3.5-Remote-AP"
    password: "password123"

captive_portal:
  id: cyd_captive_portal

# Native Home Assistant API for flawless integration
api:

# OTA Updates
ota:
  - platform: esphome

# Detailed Logging
logger:

# Sync timezone for the local clock display
time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Jerusalem"

# Reusable Fonts
font:
  - file: "gfonts://Outfit"
    id: font_title
    size: 28
  - file: "gfonts://Outfit"
    id: font_normal
    size: 18
  - file: "gfonts://Outfit"
    id: font_small
    size: 14
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icon
    size: 28
    glyphs:
      - "\U000F0769" # ceiling-light
      - "\U000F179B" # light-recessed
      - "\U000F1798" # ceiling-fan-light
      - "\U000F1054" # outdoor-lamp
      - "\U000F0425" # power
      - "\U000F0210" # fan
      - "\U000F001B" # air-conditioner
      - "\U000F02E3" # bed
      - "\U000F05A8" # weather-sunny (Sun)
      - "\U000F0594" # weather-night (Moon)
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icon_large
    size: 75
    glyphs:
      - "\U000F0769" # ceiling-light
      - "\U000F179B" # light-recessed
      - "\U000F1798" # ceiling-fan-light
      - "\U000F1054" # outdoor-lamp
      - "\U000F0425" # power
      - "\U000F0210" # fan
      - "\U000F001B" # air-conditioner
      - "\U000F02E3" # bed
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: font_icon_toggle
    size: 20
    glyphs:
      - "\U000F05A8" # weather-sunny (Sun)
      - "\U000F0594" # weather-night (Moon)

# SPI Bus for Display (VSPI)
spi:
  - id: spi_display
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

# I2C Bus for Capacitive Touchscreen (GT911)
i2c:
  sda: GPIO33
  scl: GPIO32
  scan: true

# 3.5" TFT Display (ST7796)
display:
  - platform: ili9xxx
    id: cyd_display
    model: ST7796
    spi_id: spi_display
    cs_pin: GPIO15
    dc_pin: GPIO2
    auto_clear_enabled: false
    invert_colors: false
    color_order: bgr
    rotation: 180 # Set to 90 or 270 for landscape (depends on physical mounting)
    dimensions:
      width: 480
      height: 320
    update_interval: never

# Touchscreen Controller (GT911)
touchscreen:
  - platform: gt911
    id: cyd_touchscreen
    display: cyd_display
    address: 0x5D
    # interrupt_pin: GPIO21 # Commented out to use Polling Mode (bypasses missing R25 board resistor)
    # reset_pin: GPIO25
    update_interval: 50ms
    transform:
      swap_xy: true
      mirror_x: false
      mirror_y: true
    on_touch:
      - if:
          condition:
            lambda: 'return !id(cyd_backlight)->remote_values.is_on();'
          then:
            - light.turn_on:
                id: cyd_backlight
                transition_length: 0s
            - lvgl.resume:

# Hardware Outputs
output:
  # Display Backlight PWM on GPIO27
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm

  # Status RGB LED (inverted LEDC outputs)
  - platform: ledc
    pin: GPIO4
    id: led_red
    inverted: true
  - platform: ledc
    pin: GPIO16
    id: led_green
    inverted: true
  - platform: ledc
    pin: GPIO17
    id: led_blue
    inverted: true

  # Virtual channels (Template Outputs)
  - platform: template
    id: l1_brightness_out
    type: float
    write_action: []
  - platform: template
    id: l1_color_temp_out
    type: float
    write_action: []

  - platform: template
    id: l2_brightness_out
    type: float
    write_action: []
  - platform: template
    id: l2_color_temp_out
    type: float
    write_action: []

  - platform: template
    id: l3_brightness_out
    type: float
    write_action: []
  - platform: template
    id: l3_color_temp_out
    type: float
    write_action: []

  - platform: template
    id: l4_brightness_out
    type: float
    write_action: []
  - platform: template
    id: l4_color_temp_out
    type: float
    write_action: []

# WiFi Signal Sensor
sensor:
  - platform: wifi_signal
    name: "CYD WiFi Signal"
    id: cyd_wifi_signal
    update_interval: 10s

# WiFi SSID and IP Address text sensors
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "CYD IP Address"
      id: cyd_ip_address
    ssid:
      name: "CYD Connected SSID"
      id: cyd_ssid

  # Import entity names from Home Assistant
  - platform: homeassistant
    id: ha_name_l1
    entity_id: light.cyd_3_5_lights_controller_cyd_l1
    attribute: friendly_name
    on_value:
      then:
        - lvgl.label.update:
            id: l1_name_label
            text: !lambda |-
              if (x.empty()) return id(cyd_l1)->get_name();
              return x;
  - platform: homeassistant
    id: ha_name_l2
    entity_id: light.cyd_3_5_lights_controller_cyd_l2
    attribute: friendly_name
    on_value:
      then:
        - lvgl.label.update:
            id: l2_name_label
            text: !lambda |-
              if (x.empty()) return id(cyd_l2)->get_name();
              return x;
  - platform: homeassistant
    id: ha_name_l3
    entity_id: light.cyd_3_5_lights_controller_cyd_l3
    attribute: friendly_name
    on_value:
      then:
        - lvgl.label.update:
            id: l3_name_label
            text: !lambda |-
              if (x.empty()) return id(cyd_l3)->get_name();
              return x;
  - platform: homeassistant
    id: ha_name_l4
    entity_id: light.cyd_3_5_lights_controller_cyd_l4
    attribute: friendly_name
    on_value:
      then:
        - lvgl.label.update:
            id: l4_name_label
            text: !lambda |-
              if (x.empty()) return id(cyd_l4)->get_name();
              return x;

# Active Channel Trackers
globals:
  - id: get_temp_color
    type: 'uint32_t(*)(float)'
    initial_value: '[](float ct) -> uint32_t { float pct = (ct - 153.0f) / (500.0f - 153.0f); pct = std::max(0.0f, std::min(1.0f, pct)); int r, g, b; if (pct <= 0.5f) { float p = pct * 2.0f; r = int(p * 255); g = 255; b = 255; } else { float p = (pct - 0.5f) * 2.0f; r = 255; g = int(255 - p * 140); b = int(255 - p * 255); } return (r << 16) | (g << 8) | b; }'
  - id: dark_mode
    type: bool
    initial_value: 'true'
    restore_value: yes
  - id: active_channel
    type: int
    initial_value: '1'
    restore_value: no
  - id: l1_long_pressed
    type: bool
    initial_value: 'false'
    restore_value: no
  - id: l2_long_pressed
    type: bool
    initial_value: 'false'
    restore_value: no
  - id: l3_long_pressed
    type: bool
    initial_value: 'false'
    restore_value: no
  - id: l4_long_pressed
    type: bool
    initial_value: 'false'
    restore_value: no

  # Runtime Configurable Modes: 1 = Dimmer (Sliders), 2 = Switch (Toggle)
  - id: l1_type
    type: int
    initial_value: '1'
    restore_value: yes
  - id: l2_type
    type: int
    initial_value: '1'
    restore_value: yes
  - id: l3_type
    type: int
    initial_value: '1'
    restore_value: yes
  - id: l4_type
    type: int
    initial_value: '1'
    restore_value: yes

  # Runtime Configurable Logos
  - id: l1_logo
    type: int
    initial_value: '1'
    restore_value: yes
  - id: l2_logo
    type: int
    initial_value: '1'
    restore_value: yes
  - id: l3_logo
    type: int
    initial_value: '1'
    restore_value: yes
  - id: l4_logo
    type: int
    initial_value: '1'
    restore_value: yes

  - id: config_channel
    type: int
    initial_value: '1'
    restore_value: no
  - id: defaults_warm_initialized
    type: bool
    initial_value: 'false'
    restore_value: yes
  - id: screen_timeout_s
    type: int
    initial_value: '15'
    restore_value: yes
  - id: color_order_rgb
    type: bool
    initial_value: 'false'
    restore_value: yes

  # Explicit Non-Volatile Memory for Brightness and Color Temperature
  - id: l1_saved_brightness
    type: float
    initial_value: '1.0'
    restore_value: yes
  - id: l1_saved_color_temp
    type: float
    initial_value: '500.0'
    restore_value: yes
  - id: l2_saved_brightness
    type: float
    initial_value: '1.0'
    restore_value: yes
  - id: l2_saved_color_temp
    type: float
    initial_value: '500.0'
    restore_value: yes
  - id: l3_saved_brightness
    type: float
    initial_value: '1.0'
    restore_value: yes
  - id: l3_saved_color_temp
    type: float
    initial_value: '500.0'
    restore_value: yes
  - id: l4_saved_brightness
    type: float
    initial_value: '1.0'
    restore_value: yes
  - id: l4_saved_color_temp
    type: float
    initial_value: '500.0'
    restore_value: yes

# Dimmable & Color Status Lights
light:
  # Physical Screen Backlight
  - platform: monochromatic
    output: backlight_pwm
    name: "CYD Display Backlight"
    id: cyd_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
    on_turn_on:
      - lambda: |-
          setCpuFrequencyMhz(240);
          esp_wifi_set_ps(WIFI_PS_MIN_MODEM);
    on_turn_off:
      - lambda: |-
          setCpuFrequencyMhz(80);
          esp_wifi_set_ps(WIFI_PS_MAX_MODEM);

  # Status RGB LED on the back
  - platform: rgb
    name: "CYD Status LED"
    id: status_led
    red: led_red
    green: led_green
    blue: led_blue
    default_transition_length: 0s

  # Channel 1 Light
  - platform: color_temperature
    name: "CYD L1"
    id: cyd_l1
    gamma_correct: 0
    color_temperature: l1_color_temp_out
    brightness: l1_brightness_out
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - if:
          condition:
            lambda: 'return id(active_channel) == 1;'
          then:
            - lvgl.slider.update:
                id: brightness_slider
                value: !lambda |-
                  auto light = id(cyd_l1);
                  return (light->remote_values.is_on() ? light->remote_values.get_brightness() : 0.0f) * 100.0f;
            - lvgl.slider.update:
                id: tone_slider
                value: !lambda |-
                  return id(cyd_l1)->remote_values.get_color_temperature();
            - lambda: |-
                float ct = id(cyd_l1)->remote_values.get_color_temperature();
                lv_obj_set_style_bg_grad_color(id(brightness_slider), lv_color_hex(id(get_temp_color)(ct)), LV_PART_MAIN);
      - lvgl.label.update:
          id: l1_status_label
          text: !lambda |-
